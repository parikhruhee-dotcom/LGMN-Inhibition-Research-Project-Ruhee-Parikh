name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RDKit has no wheel for Python 3.14, which is why the project pins 3.12.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      # The suite is deliberately network-free, so CI does not depend on ChEMBL
      # or RCSB being reachable: the crystallographic ground truth used to
      # validate warhead detection is committed as SMILES in the tests. smina
      # and Open Babel are conda-only and are not needed here, since the
      # docking tests cover the selection logic rather than running a docking.
      - name: Run tests
        run: python -m pytest tests/ -q
