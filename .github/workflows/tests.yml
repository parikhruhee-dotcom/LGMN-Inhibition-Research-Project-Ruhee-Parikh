name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # RDKit has no wheel for 3.14, which is why the project pins 3.12.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest biopython

      # The test suite is deliberately network-free so CI does not depend on
      # ChEMBL or RCSB being reachable; the crystallographic ground truth is
      # committed as SMILES in the tests themselves.
      - name: Run tests
        run: python -m pytest tests/ -q
